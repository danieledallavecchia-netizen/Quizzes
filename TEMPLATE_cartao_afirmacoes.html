<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartão de Afirmações</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<!--
╔══════════════════════════════════════════════════════════════════╗
║         CONFIGURAÇÃO — PREENCHER PARA CADA CLIENTE               ║
╚══════════════════════════════════════════════════════════════════╝

INSTRUÇÕES:
1. Editar apenas este bloco CONFIG abaixo
2. Guardar e enviar o link à cliente
3. Não tocar em mais nada

PARA GERAR AS AFIRMAÇÕES E SIGNIFICADOS:
Pedir ao Claude:
"Gera 5 afirmações Eu Sou do Livro de Ouro de Saint Germain
 para uma cliente com [descrever o problema].
 Para cada uma: texto da afirmação, momento do dia, ícone emoji,
 e um parágrafo curto com o significado em linguagem simples."
-->

<script>
const CONFIG = {

  // Nome da cliente (aparece no header)
  nome: "Rita",

  // Subtítulo (opcional — descreve o tema do protocolo)
  subtitulo: "Ancoragem Interior & Identidade",

  // Duração do protocolo em dias
  dias: 21,

  // Cor de destaque (hex) — pode mudar por cliente
  // Exemplos: dourado "#C9A84C" | lavanda "#8B7BC8" | verde "#5A9E7A" | rosa "#C87B8B"
  corDestaque: "#C9A84C",

  // As 5 afirmações — em ordem cronológica do dia
  afirmacoes: [
    {
      momento: "Manhã",
      momedesc: "Ao acordar — antes do telemóvel",
      icone: "🌅",
      texto: "Eu Sou a Presença de Deus em Ação",
      significado: "Quando dizes estas palavras ao acordar, estás a reconhecer que antes de qualquer papel — mãe, profissional, parceira — a tua essência mais profunda é divina e está em movimento. Não precisas de fazer nada para merecer este estado. Ele já existe em ti."
    },
    {
      momento: "Espelho",
      momedesc: "Ao lavar o rosto — olhando nos próprios olhos",
      icone: "🪞",
      texto: "Eu Sou Vida, Opulência e Verdade, já manifestadas em Mim",
      significado: "O espelho não é apenas vidro — é o primeiro encontro do dia com a tua própria presença. 'Já manifestadas em Mim' significa que a vida plena, a abundância e a verdade não são algo a conquistar. Estão dentro, esperando ser reconhecidas. Este momento é de reconhecimento, não de avaliação."
    },
    {
      momento: "Meio-dia",
      momedesc: "Numa pausa de silêncio",
      icone: "☀️",
      texto: "Eu Sou a plena alegria e gratidão que sinto neste instante",
      significado: "A meio do dia, quando a mente está ocupada com o mundo exterior, esta afirmação traz-te de volta a ti. A alegria não depende do que o outro fez ou não fez. Existe agora, neste instante, independentemente de qualquer circunstância exterior. Respirar fundo antes de dizer ajuda a sentir."
    },
    {
      momento: "Noite",
      momedesc: "Antes de dormir",
      icone: "🌙",
      texto: "Eu Sou a Perfeição do meu mundo, auto-sustentada",
      significado: "Encerrar o dia com esta afirmação é um acto de gentileza contigo mesma. 'Auto-sustentada' é a palavra-chave: o teu equilíbrio, o teu valor e a tua paz não dependem de nenhuma pessoa exterior para se manterem. Levas esta verdade para o sono — e o inconsciente continua a integrá-la."
    },
    {
      momento: "Antídoto",
      momedesc: "Sempre que surgir comparação ou dúvida — 3× em silêncio",
      icone: "✨",
      texto: "Eu Sou a Ressurreição e a Vida",
      significado: "Quando o pensamento 'o outro pode encontrar alguém melhor' ou 'não sou suficiente' surgir — não te censures. Simplesmente diz estas palavras três vezes, em silêncio. A Ressurreição não é algo que acontece depois da morte. Acontece no instante em que escolhes regressar a ti, em vez de te perderes no pensamento."
    }
  ],

  // Texto de encerramento do cartão
  rodape: "Estas palavras não são apenas afirmações. São o reconhecimento de que o que procuras fora já existe dentro.",

  // Fonte do protocolo
  fonte: "Baseado no Livro de Ouro de Saint Germain"

}; // fim CONFIG
</script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:'DM Sans',sans-serif;
  background:#1A1208;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
}

.card{
  background:#FEFCF7;
  border-radius:20px;
  max-width:480px;
  width:100%;
  overflow:hidden;
  box-shadow:0 24px 80px rgba(0,0,0,.5);
}

/* HEADER */
.header{
  padding:36px 32px 28px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.header::before{
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.12) 0%,transparent 65%);
}
.ornament{
  font-size:11px;
  letter-spacing:.3em;
  text-transform:uppercase;
  opacity:.8;
  margin-bottom:12px;
  display:block;
  position:relative;
}
.ornament::before,.ornament::after{content:'—';margin:0 8px;opacity:.5;}
.header h1{
  font-family:'Cormorant Garamond',serif;
  font-size:40px;
  font-weight:300;
  color:#E8D5A0;
  letter-spacing:.04em;
  line-height:1;
  position:relative;
}
.header h1 em{
  display:block;
  font-size:14px;
  font-style:normal;
  font-family:'DM Sans',sans-serif;
  font-weight:300;
  color:rgba(232,213,160,.5);
  letter-spacing:.16em;
  text-transform:uppercase;
  margin-top:7px;
}
.days-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border-radius:99px;
  padding:5px 14px;
  margin-top:16px;
  position:relative;
}
.days-badge span{font-size:11.5px;letter-spacing:.08em;}
.days-badge strong{font-weight:600;}

/* BODY */
.body{padding:28px 28px 8px;}

/* AFIRMAÇÃO */
.afirmacao{
  padding:14px 0 14px 18px;
  margin-bottom:4px;
  position:relative;
  border-radius:0 8px 8px 0;
  transition:background .2s;
}
.afirmacao-top{
  display:flex;
  align-items:flex-start;
  gap:10px;
}
.af-icone-momento{
  font-size:22px;
  flex-shrink:0;
  line-height:1.2;
  margin-top:2px;
}
.af-conteudo{flex:1;}
.afirmacao-texto{
  font-family:'Cormorant Garamond',serif;
  font-size:26px;
  font-weight:400;
  color:#1A1208;
  line-height:1.25;
  margin-bottom:4px;
}
.afirmacao-texto em{font-style:italic;color:#3D2C10;}
.afirmacao-quando{
  font-size:12.5px;
  color:#7A6040;
  letter-spacing:.03em;
}
/* Botão de significado */
.btn-sig{
  flex-shrink:0;
  width:28px;
  height:28px;
  border-radius:50%;
  border:1.5px solid;
  background:transparent;
  cursor:pointer;
  font-size:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all .2s;
  margin-top:4px;
  color:inherit;
}
.btn-sig:hover{opacity:.75;}
.btn-sig[aria-expanded="true"]{color:#FEFCF7!important;border-color:transparent!important;}

/* Painel de significado */
.sig-panel{
  display:none;
  margin-top:10px;
  padding:12px 14px;
  border-radius:8px;
  font-size:13.5px;
  line-height:1.7;
  color:#3D2C10;
  background:rgba(0,0,0,.04);
  font-style:italic;
}
.sig-panel.open{display:block;}

.divider{
  height:1px;
  background:linear-gradient(90deg,transparent,#E8D5A0,transparent);
  margin:4px 0;
  opacity:.35;
}

/* PROTOCOLO RESUMO */
.protocolo{
  border-radius:12px;
  padding:18px 20px;
  margin:20px 28px 0;
}
.protocolo h3{
  font-family:'Cormorant Garamond',serif;
  font-size:15px;
  font-weight:600;
  letter-spacing:.06em;
  text-transform:uppercase;
  margin-bottom:12px;
  color:#3D2C10;
}
.prow{
  display:flex;
  gap:10px;
  align-items:flex-start;
  margin-bottom:8px;
  font-size:12.5px;
  line-height:1.5;
}
.prow:last-child{margin-bottom:0;}
.prow .momento{
  flex-shrink:0;
  font-weight:600;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.06em;
  padding-top:1px;
  min-width:72px;
}
.prow .acao{color:#7A6040;}
.prow .acao strong{color:#3D2C10;font-weight:600;}

/* ESPELHO */
.espelho{
  margin:16px 28px 0;
  border:1px solid;
  border-radius:12px;
  padding:16px 18px;
}
.espelho h3{
  font-family:'Cormorant Garamond',serif;
  font-size:14px;
  font-weight:600;
  letter-spacing:.06em;
  text-transform:uppercase;
  margin-bottom:8px;
  color:#3D2C10;
}
.espelho p{font-size:12.5px;color:#7A6040;line-height:1.65;}
.frase-espelho{
  font-family:'Cormorant Garamond',serif;
  font-size:16px;
  font-style:italic;
  color:#3D2C10;
  margin:8px 0 6px;
  padding:8px 12px;
  border-radius:7px;
  line-height:1.4;
}

/* FOOTER */
.footer{padding:20px 28px 28px;text-align:center;}
.footer p{font-size:11.5px;color:#B09878;line-height:1.7;font-style:italic;}
.footer .source{
  font-size:10.5px;
  letter-spacing:.06em;
  margin-top:8px;
  display:block;
  opacity:.7;
}

@media print{
  body{background:#fff;padding:0;}
  .card{box-shadow:none;border-radius:0;max-width:100%;}
  .btn-sig{display:none;}
  .sig-panel{display:block!important;}
}
</style>
</head>
<body>

<div class="card" id="card">

  <div class="header" id="header">
    <span class="ornament" id="ornamento">Protocolo Pessoal</span>
    <h1 id="titulo-nome">—<em id="subtitulo-txt">—</em></h1>
    <div class="days-badge" id="badge">
      <span>3× ao dia · durante <strong id="dias-txt">—</strong> dias</span>
    </div>
  </div>

  <div class="body" id="body-afirmacoes"></div>

  <div class="protocolo" id="protocolo">
    <h3>Como fazer</h3>
    <div id="protocolo-rows"></div>
  </div>

  <div class="espelho" id="espelho-box">
    <h3>Exercício do Espelho — <span id="esp-dias">—</span> dias</h3>
    <p>Todos os dias, ao lavar o rosto. Olhar nos próprios olhos. Dizer com voz audível:</p>
    <div class="frase-espelho" id="frase-espelho">—</div>
    <p>Se não conseguires dizer — fica só a olhar. Uma vez dita com presença vale mais do que dez vezes mecânicas.</p>
  </div>

  <div class="footer">
    <p id="rodape-txt">—</p>
    <span class="source" id="fonte-txt">—</span>
  </div>

</div>

<script>
(function(){
  const C = CONFIG;
  const cor = C.corDestaque || '#C9A84C';

  // Calcular cor de fundo escuro a partir da cor de destaque
  function hexToHsl(hex){
    let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
    let max=Math.max(r,g,b),min=Math.min(r,g,b),h,s,l=(max+min)/2;
    if(max===min){h=s=0;}else{let d=max-min;s=l>.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}h/=6;}
    return [Math.round(h*360),Math.round(s*100),Math.round(l*100)];
  }
  const [h,s] = hexToHsl(cor);
  const bgDark = `hsl(${h},${Math.min(s,80)}%,8%)`;
  const bgMid  = `hsl(${h},${Math.min(s,60)}%,15%)`;
  const paleLt = `hsl(${h},${Math.min(s,40)}%,95%)`;
  const paleMd = `hsl(${h},${Math.min(s,35)}%,88%)`;

  // Aplicar cores
  document.body.style.background = bgDark;
  const header = document.getElementById('header');
  header.style.background = `linear-gradient(160deg,${bgDark} 0%,${bgMid} 50%,${bgDark} 100%)`;

  const badge = document.getElementById('badge');
  badge.style.background = `rgba(${hexR(cor)},${hexG(cor)},${hexB(cor)},.15)`;
  badge.style.border = `1px solid rgba(${hexR(cor)},${hexG(cor)},${hexB(cor)},.3)`;
  badge.style.color = cor;
  badge.querySelector('strong').style.color = lighten(cor);

  document.getElementById('ornamento').style.color = cor;

  const proto = document.getElementById('protocolo');
  proto.style.background = paleLt;

  const espBox = document.getElementById('espelho-box');
  espBox.style.borderColor = `rgba(${hexR(cor)},${hexG(cor)},${hexB(cor)},.3)`;
  espBox.style.background = `linear-gradient(135deg,${paleMd},${paleLt})`;
  espBox.querySelector('.frase-espelho').style.background = `rgba(${hexR(cor)},${hexG(cor)},${hexB(cor)},.08)`;

  // Preencher textos
  document.getElementById('titulo-nome').childNodes[0].nodeValue = C.nome + ' ';
  document.getElementById('subtitulo-txt').textContent = C.subtitulo || 'Protocolo de Afirmações';
  document.getElementById('dias-txt').textContent = C.dias;
  document.getElementById('esp-dias').textContent = C.dias;
  document.getElementById('rodape-txt').textContent = C.rodape || '';
  document.getElementById('fonte-txt').textContent = C.fonte || '';
  document.getElementById('fonte-txt').style.color = cor;

  // Afirmações
  const body = document.getElementById('body-afirmacoes');
  const protoRows = document.getElementById('protocolo-rows');
  // Encontrar a afirmação do espelho para o box
  const espAfirmacao = C.afirmacoes.find(a => a.momento.toLowerCase().includes('espelho'));
  if(espAfirmacao) document.getElementById('frase-espelho').textContent = '"' + espAfirmacao.texto + '"';

  C.afirmacoes.forEach(function(af, i){
    // Bloco afirmação
    const div = document.createElement('div');
    div.className = 'afirmacao';

    // Formatar texto com itálico (parte após vírgula ou "já")
    const textoFormatado = af.texto.replace(/, (.+)$/, ', <em>$1</em>').replace(/(já .+)$/, '<em>$1</em>');

    div.innerHTML = `
      <div class="afirmacao-top">
        <span class="af-icone-momento">${af.icone}</span>
        <div class="af-conteudo">
          <div class="afirmacao-texto">${textoFormatado}</div>
          <div class="afirmacao-quando">${af.momedesc}</div>
        </div>
        <button class="btn-sig" aria-expanded="false" title="Ver significado" id="btn-${i}"
          style="border-color:${cor};color:${cor};">ℹ</button>
      </div>
      <div class="sig-panel" id="sig-${i}" style="border-left:3px solid ${cor};">
        ${af.significado}
      </div>
    `;
    body.appendChild(div);

    // Toggle significado
    const btn = div.querySelector(`#btn-${i}`);
    const panel = div.querySelector(`#sig-${i}`);
    btn.addEventListener('click', function(){
      const open = panel.classList.toggle('open');
      btn.setAttribute('aria-expanded', open);
      if(open){ btn.style.background = cor; btn.style.borderColor = cor; btn.style.color = '#fff'; }
      else{ btn.style.background = 'transparent'; btn.style.borderColor = cor; btn.style.color = cor; }
    });

    // Divider (não após último)
    if(i < C.afirmacoes.length - 1){
      const div2 = document.createElement('div');
      div2.className = 'divider';
      body.appendChild(div2);
    }

    // Protocolo row
    const row = document.createElement('div');
    row.className = 'prow';
    row.innerHTML = `<span class="momento" style="color:${cor};">${af.icone} ${af.momento}</span><span class="acao">${af.momedesc.split('—')[1]||af.momedesc}</span>`;
    protoRows.appendChild(row);
  });

  // Helpers cor
  function hexR(h){return parseInt(h.slice(1,3),16);}
  function hexG(h){return parseInt(h.slice(3,5),16);}
  function hexB(h){return parseInt(h.slice(5,7),16);}
  function lighten(hex){
    let r=hexR(hex),g=hexG(hex),b=hexB(hex);
    r=Math.min(255,r+60);g=Math.min(255,g+60);b=Math.min(255,b+60);
    return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
  }

})();
</script>
</body>
</html>
