<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Questionário Big Five — OCEAN</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,sans-serif;background:linear-gradient(135deg,#f0f8ff 0%,#e8f5f0 100%);min-height:100vh;color:#2d2d3a}
.cover{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.cover-icon{width:80px;height:80px;background:linear-gradient(135deg,#4a8fa5,#2d7a5e);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 24px;box-shadow:0 8px 24px rgba(74,143,165,.25)}
.cover-title{font-size:clamp(22px,5vw,30px);font-weight:700;color:#2d2d3a;margin-bottom:8px}
.cover-sub{font-size:15px;color:#6b6b80;max-width:440px;line-height:1.7;margin-bottom:10px}
.cover-time{font-size:13px;color:#5a9ea8;margin-bottom:32px}
.cover-start{padding:14px 40px;background:linear-gradient(135deg,#4a8fa5,#2d7a5e);color:white;border:none;border-radius:50px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(74,143,165,.3);transition:.2s}
.cover-start:hover{transform:translateY(-2px)}
.quiz-wrap{max-width:640px;margin:0 auto;padding:24px 20px}
.progress-bar{background:#d0eaf0;border-radius:99px;height:6px;margin-bottom:8px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#4a8fa5,#2d7a5e);border-radius:99px;transition:.4s}
.q-counter{font-size:12px;color:#5a9ea8;text-align:right;margin-bottom:20px}
.dim-badge{display:inline-block;padding:3px 12px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:14px}
.q-text{font-size:clamp(15px,4vw,18px);font-weight:600;color:#2d2d3a;line-height:1.5;margin-bottom:24px}
.scale-wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.scale-btn{padding:14px 8px;background:white;border:2px solid #d0eaf0;border-radius:12px;font-size:13px;font-family:inherit;cursor:pointer;transition:.15s;color:#2d2d3a;text-align:center;font-weight:500}
.scale-btn:hover{border-color:#4a8fa5;background:#f0f8ff}
.scale-btn.selected{border-color:#4a8fa5;background:linear-gradient(135deg,rgba(74,143,165,.12),rgba(45,122,94,.08));font-weight:700;color:#2d7a5e}
.scale-labels{display:flex;justify-content:space-between;font-size:11px;color:#8b9ea8;padding:0 4px;margin-bottom:20px}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.btn-nav{padding:11px 28px;border-radius:99px;border:none;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn-back{background:#e0f0f4;color:#4a8fa5}
.btn-next{background:linear-gradient(135deg,#4a8fa5,#2d7a5e);color:white;box-shadow:0 4px 12px rgba(74,143,165,.25)}
.btn-next:disabled{opacity:.35;cursor:default;box-shadow:none}
.result-wrap{max-width:640px;margin:0 auto;padding:24px 20px 60px}
.result-header{background:linear-gradient(135deg,#4a8fa5,#2d7a5e);border-radius:20px;padding:28px;color:white;margin-bottom:16px;text-align:center}
.result-title{font-size:20px;font-weight:700;margin-bottom:4px}
.result-sub{font-size:13px;opacity:.8}
.result-card{background:white;border-radius:16px;padding:22px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.card-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#5a9ea8;margin-bottom:16px}
.dim-row{margin-bottom:18px}
.dim-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dim-name{font-size:14px;font-weight:600}
.dim-score{font-size:14px;font-weight:700}
.dim-desc{font-size:12px;color:#8b9ea8;margin-bottom:6px}
.dim-track{background:#e8f0f4;border-radius:99px;height:10px;overflow:hidden}
.dim-fill{height:100%;border-radius:99px;transition:.6s}
.sending{text-align:center;padding:60px 20px}
.sending-icon{font-size:40px;margin-bottom:16px}
.sending p{color:#8b8ba0;font-size:14px}
.hidden{display:none}
.nome-tag{font-size:13px;color:white;opacity:.75;margin-bottom:8px}
</style>
</head>
<body>

<div id="cover" class="cover">
  <div class="cover-icon">🌊</div>
  <h1 class="cover-title">Personalidade Big Five</h1>
  <p class="cover-sub">O modelo OCEAN mede 5 dimensões fundamentais da personalidade reconhecidas internacionalmente pela psicologia científica.</p>
  <p class="cover-time">⏱ 8–12 minutos · 25 afirmações</p>
  <button class="cover-start" onclick="iniciar()">Começar →</button>
</div>

<div id="quiz" class="quiz-wrap hidden">
  <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
  <div class="q-counter" id="counter"></div>
  <div class="dim-badge" id="dimBadge"></div>
  <div class="q-text" id="qtext"></div>
  <div class="scale-wrap" id="scaleWrap"></div>
  <div class="scale-labels">
    <span>Discordo totalmente</span>
    <span>Concordo totalmente</span>
  </div>
  <div class="nav-row">
    <button class="btn-nav btn-back" onclick="anterior()">← Anterior</button>
    <button class="btn-nav btn-next" id="btnNext" onclick="proximo()" disabled>Seguinte →</button>
  </div>
</div>

<div id="sending" class="sending hidden">
  <div class="sending-icon">📤</div>
  <p>A guardar o teu resultado…</p>
</div>

<div id="result" class="result-wrap hidden"></div>

<script>
const APPS_URL = 'https://script.google.com/macros/s/AKfycbxW4NiXlsKJMLB3sNGaus2gllggJgY-LnPcbQnOD2T6Cq5DxDAYk-W0lm1nLdvNxifC/exec';
const params = new URLSearchParams(window.location.search);
const NOME = params.get('nome') || '';
const CLIENT_ID = params.get('id') || '';

const DIMS = {
  O:{nome:'Abertura à Experiência',cor:'#9b59b6',desc:'Curiosidade intelectual, apreciação estética, imaginação e abertura a novas ideias.',baixo:'Preferes o familiar e o concreto. Práticas, conservadoras e consistentes.',alto:'Curiosa, criativa, com amplos interesses intelectuais e artísticos.'},
  C:{nome:'Conscienciosidade',cor:'#2980b9',desc:'Organização, disciplina, orientação para objectivos e confiabilidade.',baixo:'Flexible e espontânea. Preferes adaptar-te ao fluxo em vez de planear.',alto:'Organizada, responsável e orientada para objectivos com autodisciplina.'},
  E:{nome:'Extroversão',cor:'#e67e22',desc:'Sociabilidade, assertividade, energia positiva e tendência para procurar estimulação.',baixo:'Introvertida e reflexiva. Energia restaurada no silêncio e na solidão.',alto:'Sociável, enérgica e assertiva. Procuras activamente a companhia dos outros.'},
  A:{nome:'Amabilidade',cor:'#27ae60',desc:'Confiança, altruísmo, cooperação, modéstia e sensibilidade para com os outros.',baixo:'Directa e independente. Podes ser céptica e competitiva quando necessário.',alto:'Empática, cooperativa e orientada para a harmonia e bem-estar alheio.'},
  N:{nome:'Neuroticismo',cor:'#c0392b',desc:'Tendência para experienciar emoções negativas: ansiedade, tristeza, irritabilidade.',baixo:'Emocionalmente estável. Calma perante o stresse, recuperas rapidamente.',alto:'Experiencias emoções com intensidade. Sensível, reativa, tende para a preocupação.'},
};

const PERGUNTAS = [
  {dim:'O',texto:'Tenho uma imaginação activa e gosto de pensar em cenários e possibilidades.',inv:false},
  {dim:'C',texto:'Sou sempre bem preparada e organizada nas tarefas que assumo.',inv:false},
  {dim:'E',texto:'Sinto-me cheia de energia quando estou em grupos grandes de pessoas.',inv:false},
  {dim:'A',texto:'Geralmente confio nas intenções das pessoas e acredito no melhor dos outros.',inv:false},
  {dim:'N',texto:'Fico ansiosa ou preocupada com facilidade, mesmo sem razão aparente.',inv:false},
  {dim:'O',texto:'Tenho pouco interesse em arte, música ou literatura.',inv:true},
  {dim:'C',texto:'Às vezes deixo as coisas para o último momento ou esqueço compromissos.',inv:true},
  {dim:'E',texto:'Prefiro trabalhar sozinha a trabalhar em equipa.',inv:true},
  {dim:'A',texto:'Não me importo em confrontar os outros quando é necessário.',inv:true},
  {dim:'N',texto:'Raramente me sinto triste ou deprimida sem motivo claro.',inv:true},
  {dim:'O',texto:'Adoro explorar novas ideias, filosofias e formas diferentes de ver o mundo.',inv:false},
  {dim:'C',texto:'Cumpro sempre as minhas responsabilidades e raramente falho compromissos.',inv:false},
  {dim:'E',texto:'Tenho facilidade em iniciar conversas com pessoas que não conheço.',inv:false},
  {dim:'A',texto:'Preocupo-me genuinamente com o bem-estar dos outros.',inv:false},
  {dim:'N',texto:'Quando as coisas correm mal, costumo ficar muito perturbada emocionalmente.',inv:false},
  {dim:'O',texto:'Tenho curiosidade sobre muitos temas diferentes, mesmo fora da minha área.',inv:false},
  {dim:'C',texto:'Estabeleço planos e sigo-os com disciplina.',inv:false},
  {dim:'E',texto:'Sinto-me confortável a ser o centro das atenções.',inv:false},
  {dim:'A',texto:'Posso ser fria ou distante quando não me identifico com alguém.',inv:true},
  {dim:'N',texto:'Mantenho a calma em situações stressantes.',inv:true},
  {dim:'O',texto:'Tenho pouco interesse em debater ideias abstractas ou filosóficas.',inv:true},
  {dim:'C',texto:'Sou metódica e prefiro fazer as coisas de forma sistemática.',inv:false},
  {dim:'E',texto:'Prefiro passar o tempo com poucas pessoas do que em grupos grandes.',inv:true},
  {dim:'A',texto:'Tenho dificuldade em perdoar quando alguém me magoa.',inv:true},
  {dim:'N',texto:'As críticas afectam-me mais do que devia.',inv:false},
];

const DIM_COLORS = {O:'#9b59b6',C:'#2980b9',E:'#e67e22',A:'#27ae60',N:'#c0392b'};
const ESCALA = ['1\nDiscordo totalmente','2\nDiscordo','3\nNeutro','4\nConcordo','5\nConcordo totalmente'];

let atual = 0, respostas = {};

function iniciar() {
  document.getElementById('cover').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  mostrarPergunta();
}

function mostrarPergunta() {
  const p = PERGUNTAS[atual], total = PERGUNTAS.length;
  document.getElementById('prog').style.width = ((atual/total)*100)+'%';
  document.getElementById('counter').textContent = `Afirmação ${atual+1} de ${total}`;
  const d = DIMS[p.dim];
  const badge = document.getElementById('dimBadge');
  badge.textContent = d.nome;
  badge.style.background = DIM_COLORS[p.dim]+'20';
  badge.style.color = DIM_COLORS[p.dim];
  document.getElementById('qtext').textContent = p.texto;
  const sel = respostas[atual];
  document.getElementById('btnNext').disabled = sel === undefined;
  document.getElementById('scaleWrap').innerHTML = [1,2,3,4,5].map(v=>`
    <button class="scale-btn ${sel===v?'selected':''}" onclick="selecionar(${v})" style="${sel===v?'border-color:'+DIM_COLORS[p.dim]+';':''}">
      ${v}
    </button>`).join('');
}

function selecionar(v) { respostas[atual]=v; mostrarPergunta(); }
function anterior() { if(atual>0){atual--;mostrarPergunta();} }
function proximo() { if(atual<PERGUNTAS.length-1){atual++;mostrarPergunta();}else{calcular();} }

function calcular() {
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('sending').classList.remove('hidden');
  const scores = {O:0,C:0,E:0,A:0,N:0};
  const counts = {O:0,C:0,E:0,A:0,N:0};
  PERGUNTAS.forEach((p,i) => {
    if(respostas[i]!==undefined){
      const v = p.inv ? 6-respostas[i] : respostas[i];
      scores[p.dim]+=v; counts[p.dim]++;
    }
  });
  const avg={};
  Object.keys(scores).forEach(k=>{ avg[k]=counts[k]?Math.round((scores[k]/counts[k])*20):0; }); // 0-100
  const resumo = Object.entries(avg).map(([k,v])=>`${k}:${v}%`).join(' · ');
  const dados = {O:avg.O,C:avg.C,E:avg.E,A:avg.A,N:avg.N};
  enviar({quiz:'bigfive',resumo,dados,nome:NOME,id:CLIENT_ID},()=>mostrarResultado(avg));
}

function enviar(payload,cb) {
  const cbName='cb_'+Date.now();
  window[cbName]=()=>{cb();};
  const s=document.createElement('script');
  s.src=APPS_URL+'?callback='+cbName+'&data='+encodeURIComponent(JSON.stringify(payload));
  s.onerror=()=>cb();
  document.head.appendChild(s);
  setTimeout(cb,6000);
}

function mostrarResultado(avg) {
  document.getElementById('sending').classList.add('hidden');
  const el=document.getElementById('result');
  el.classList.remove('hidden');
  const dimHtml=Object.entries(DIMS).map(([k,d])=>`
    <div class="dim-row">
      <div class="dim-head">
        <div class="dim-name" style="color:${d.cor}">${d.nome} (${k})</div>
        <div class="dim-score" style="color:${d.cor}">${avg[k]}%</div>
      </div>
      <div class="dim-desc">${avg[k]>=60?d.alto:avg[k]<=40?d.baixo:d.desc}</div>
      <div class="dim-track"><div class="dim-fill" style="width:${avg[k]}%;background:${d.cor}"></div></div>
    </div>`).join('');
  el.innerHTML=`
    <div class="result-header">
      ${NOME?`<div class="nome-tag">${NOME}</div>`:''}
      <div class="result-title">Perfil OCEAN</div>
      <div class="result-sub">Big Five — 5 dimensões fundamentais da personalidade</div>
    </div>
    <div class="result-card"><div class="card-title">As tuas 5 dimensões</div>${dimHtml}</div>
    <div class="result-card" style="text-align:center;color:#5a9ea8;font-size:13px">✓ Resultado enviado à tua terapeuta</div>`;
}

if (NOME) iniciar();
</script>
</body>
</html>
