<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca Clínica de Avaliações — Daniele Dallavecchia</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy:    #1a2744;
  --deep:    #0f1a35;
  --gold:    #c9a84c;
  --gold-lt: #e8c97a;
  --cream:   #f8f5ef;
  --cream2:  #f0ead8;
  --white:   #ffffff;
  --text:    #2c3550;
  --text-lt: #6b7594;
  --border:  #dcd6c8;
  --rose:    #b85c6e;
  --sage:    #5a7a6e;
  --lavender:#7b5ea7;
  --amber:   #c9702c;
  --r:       8px;
  --shadow:  0 4px 20px rgba(26,39,68,.1);
  --sidebar-w: 280px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; font-size: 14px; }

/* ── LAYOUT ── */
.app { display: flex; height: 100vh; overflow: hidden; }

/* ── SIDEBAR ── */
.sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w);
  background: var(--deep); display: flex; flex-direction: column;
  overflow: hidden;
}
.sb-header {
  padding: 20px 18px 16px; border-bottom: 1px solid rgba(255,255,255,.07);
  flex-shrink: 0;
}
.sb-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.sb-logo svg { width: 32px; height: 32px; flex-shrink: 0; }
.sb-logo-text h1 { font-family: 'Playfair Display', serif; font-size: 12px; color: var(--gold); line-height: 1.3; }
.sb-logo-text p  { font-size: 9px; color: rgba(255,255,255,.3); letter-spacing: .8px; text-transform: uppercase; margin-top: 1px; }

.sb-client-select { width: 100%; }
.sb-client-select label { font-size: 9px; text-transform: uppercase; letter-spacing: 1.2px; color: rgba(255,255,255,.25); display: block; margin-bottom: 5px; }
.sb-client-select select {
  width: 100%; padding: 7px 10px; background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.1); border-radius: 6px;
  color: rgba(255,255,255,.75); font-size: 12px; font-family: 'DM Sans', sans-serif; cursor: pointer;
}
.sb-client-select select option { background: var(--deep); }

.sb-nav { flex: 1; overflow-y: auto; padding: 12px 0; }
.sb-nav::-webkit-scrollbar { width: 3px; }
.sb-nav::-webkit-scrollbar-track { background: transparent; }
.sb-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 3px; }

.sb-cat-label {
  padding: 12px 18px 4px; font-size: 9px; text-transform: uppercase;
  letter-spacing: 1.5px; color: rgba(255,255,255,.2); font-weight: 600;
}
.sb-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 18px; cursor: pointer; font-size: 12px;
  color: rgba(255,255,255,.55); border: none; background: none;
  width: 100%; text-align: left; transition: .15s;
  border-left: 2px solid transparent; position: relative;
}
.sb-item:hover { background: rgba(255,255,255,.05); color: rgba(255,255,255,.85); }
.sb-item.active { background: rgba(201,168,76,.1); color: var(--gold-lt); border-left-color: var(--gold); }
.sb-item .ic { font-size: 15px; flex-shrink: 0; }
.sb-item .nm { flex: 1; line-height: 1.3; }
.sb-item .badge-avail { font-size: 9px; padding: 2px 6px; border-radius: 99px; background: rgba(90,122,110,.3); color: #8bc4b0; font-weight: 600; }
.sb-item .badge-wip   { font-size: 9px; padding: 2px 6px; border-radius: 99px; background: rgba(201,168,76,.15); color: var(--gold); }

/* ── MAIN ── */
.main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
.main::-webkit-scrollbar { width: 5px; }
.main::-webkit-scrollbar-track { background: var(--cream2); }
.main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── WELCOME ── */
#welcomeView {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  flex: 1; padding: 48px 32px; text-align: center;
}
.wv-icon { font-size: 52px; margin-bottom: 20px; opacity: .7; }
.wv-title { font-family: 'Playfair Display', serif; font-size: 26px; color: var(--navy); margin-bottom: 10px; }
.wv-sub { font-size: 14px; color: var(--text-lt); max-width: 380px; line-height: 1.7; }
.wv-stats { display: flex; gap: 24px; margin-top: 28px; }
.wv-stat { text-align: center; }
.wv-stat-n { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--navy); }
.wv-stat-l { font-size: 11px; color: var(--text-lt); text-transform: uppercase; letter-spacing: .8px; }

/* ── QUIZ VIEW ── */
#quizView { display: none; flex: 1; flex-direction: column; }

.qv-hero {
  padding: 28px 36px 24px;
  border-bottom: 1px solid var(--border);
  background: white;
  position: sticky; top: 0; z-index: 10;
}
.qv-breadcrumb { font-size: 11px; color: var(--text-lt); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.qv-breadcrumb span { color: var(--gold); }
.qv-title-row { display: flex; align-items: flex-start; gap: 14px; }
.qv-icon-badge {
  width: 52px; height: 52px; border-radius: 14px; display: flex;
  align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0;
}
.qv-title { flex: 1; }
.qv-title h1 { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--navy); margin-bottom: 4px; }
.qv-meta { display: flex; gap: 10px; flex-wrap: wrap; }
.qv-tag {
  font-size: 11px; padding: 3px 10px; border-radius: 99px;
  background: var(--cream2); color: var(--text-lt); border: 1px solid var(--border);
}
.qv-tag.avail { background: rgba(90,122,110,.1); color: var(--sage); border-color: rgba(90,122,110,.25); }
.qv-tag.wip   { background: rgba(201,168,76,.1); color: #7a5000; border-color: rgba(201,168,76,.25); }

.qv-body { padding: 28px 36px; display: flex; flex-direction: column; gap: 24px; }

/* ── SECTIONS ── */
.section {
  background: white; border-radius: 12px; border: 1px solid var(--border);
  overflow: hidden; box-shadow: 0 2px 8px rgba(26,39,68,.05);
}
.section-head {
  padding: 14px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; cursor: pointer;
  background: white; transition: background .15s;
}
.section-head:hover { background: var(--cream); }
.section-head-icon { font-size: 16px; }
.section-head-text { flex: 1; }
.section-head-text h3 { font-size: 13px; font-weight: 600; color: var(--navy); }
.section-head-text p  { font-size: 11px; color: var(--text-lt); margin-top: 1px; }
.section-toggle { color: var(--text-lt); font-size: 14px; transition: transform .2s; }
.section-toggle.open { transform: rotate(180deg); }
.section-body { padding: 18px 20px; }
.section-body.hidden { display: none; }

/* ── PROSE ── */
.prose { font-size: 13.5px; color: var(--text); line-height: 1.8; }
.prose strong { color: var(--navy); }
.prose em { font-style: italic; color: var(--text-lt); }

/* ── RESULT CARDS ── */
.result-grid { display: flex; flex-direction: column; gap: 12px; }
.result-card {
  border-radius: 10px; border: 1px solid var(--border);
  overflow: hidden;
}
.result-card-head {
  padding: 12px 16px; display: flex; align-items: center; gap: 10px;
  cursor: pointer; transition: opacity .15s;
}
.result-card-head:hover { opacity: .85; }
.result-card-label { font-size: 13px; font-weight: 600; flex: 1; }
.result-card-sub   { font-size: 11px; opacity: .75; }
.result-card-body  { padding: 14px 16px; border-top: 1px solid rgba(255,255,255,.15); display: none; }
.result-card-body.open { display: block; }
.result-card-body p { font-size: 13px; line-height: 1.75; margin-bottom: 8px; color: var(--text); }
.result-card-body .tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.result-card-body .tag { font-size: 11px; padding: 3px 9px; border-radius: 99px; background: rgba(255,255,255,.25); font-weight: 500; }

/* ── SEND BOX ── */
.send-box {
  background: linear-gradient(135deg, var(--navy), var(--deep));
  border-radius: 12px; padding: 22px 24px; color: white;
}
.send-box h3 { font-family: 'Playfair Display', serif; font-size: 17px; color: var(--gold); margin-bottom: 6px; }
.send-box p  { font-size: 12px; color: rgba(255,255,255,.55); margin-bottom: 18px; line-height: 1.6; }

.send-client-info {
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1);
  border-radius: 8px; padding: 10px 14px; margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.send-client-info .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,.35); }
.send-client-info .val { font-size: 13px; color: rgba(255,255,255,.9); font-weight: 500; }

.send-link-box {
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
  border-radius: 8px; padding: 10px 14px; margin-bottom: 14px;
  font-family: 'DM Mono', monospace; font-size: 11px; color: var(--gold-lt);
  word-break: break-all; line-height: 1.5; cursor: text; user-select: all;
  min-height: 38px;
}

.send-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 12.5px; font-family: 'DM Sans', sans-serif; font-weight: 500; transition: .15s; display: inline-flex; align-items: center; gap: 6px; }
.btn-gold { background: var(--gold); color: var(--deep); }
.btn-gold:hover { background: var(--gold-lt); }
.btn-outline-w { background: transparent; border: 1px solid rgba(255,255,255,.25); color: rgba(255,255,255,.85); }
.btn-outline-w:hover { background: rgba(255,255,255,.08); }
.btn-whatsapp { background: rgba(37,211,102,.15); color: #25d366; border: 1px solid rgba(37,211,102,.3); }
.btn-sm { padding: 6px 12px; font-size: 11.5px; }
.btn-danger { background: rgba(184,92,110,.15); color: var(--rose); border: 1px solid rgba(184,92,110,.3); }

.email-row { display: flex; gap: 8px; align-items: center; }
.email-row input {
  flex: 1; padding: 8px 12px; background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.15); border-radius: 6px;
  color: white; font-size: 12px; font-family: 'DM Sans', sans-serif;
}
.email-row input::placeholder { color: rgba(255,255,255,.3); }
.email-row input:focus { outline: none; border-color: var(--gold); }

/* ── IA BOX ── */
.ia-box {
  border-radius: 12px; border: 1px solid var(--border);
  overflow: hidden;
}
.ia-box-head {
  padding: 14px 20px; background: linear-gradient(135deg, rgba(123,94,167,.08), rgba(74,111,165,.06));
  border-bottom: 1px solid rgba(123,94,167,.15);
  display: flex; align-items: center; justify-content: space-between;
}
.ia-box-head h3 { font-size: 13px; font-weight: 600; color: var(--lavender); display: flex; align-items: center; gap: 8px; }
.ia-box-body { padding: 18px 20px; }
.ia-empty { text-align: center; padding: 24px; color: var(--text-lt); }
.ia-empty .ie-icon { font-size: 28px; margin-bottom: 10px; }
.ia-empty p { font-size: 13px; line-height: 1.6; }

.ia-result-list { display: flex; flex-direction: column; gap: 16px; }
.ia-result-item {
  border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
}
.ia-result-item-head {
  padding: 12px 16px; background: var(--cream);
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.ia-result-item-head .quiz-name { font-size: 13px; font-weight: 600; color: var(--navy); }
.ia-result-item-head .quiz-date { font-size: 11px; color: var(--text-lt); }
.ia-result-raw { padding: 10px 16px; background: rgba(90,122,110,.06); font-size: 12px; color: var(--sage); border-bottom: 1px solid var(--border); }

.ia-interpretation {
  padding: 14px 16px;
  background: linear-gradient(135deg, rgba(123,94,167,.04), rgba(74,111,165,.04));
}
.ia-interpretation-text { font-size: 13px; line-height: 1.8; color: var(--text); white-space: pre-wrap; }
.ia-notas-area {
  width: 100%; min-height: 90px; padding: 10px 12px; margin-top: 12px;
  border: 1px solid var(--border); border-radius: 8px;
  font-size: 12.5px; font-family: 'DM Sans', sans-serif; line-height: 1.6;
  resize: vertical; color: var(--text); background: white;
  transition: border-color .15s;
}
.ia-notas-area:focus { outline: none; border-color: var(--lavender); }
.ia-notas-label { font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-lt); margin-top: 12px; margin-bottom: 5px; }

/* ── DECISION TREE ── */
.decision-tree { display: flex; flex-direction: column; gap: 10px; }
.dt-item {
  border-radius: 8px; overflow: hidden; border: 1px solid var(--border);
}
.dt-condition {
  padding: 10px 14px; font-size: 12px; font-weight: 600;
  background: var(--cream2); color: var(--navy);
  display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border);
}
.dt-action {
  padding: 10px 14px; font-size: 12.5px; color: var(--text); line-height: 1.6;
}
.dt-action ul { padding-left: 18px; margin-top: 4px; }
.dt-action li { margin-bottom: 3px; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--navy); color: white; padding: 10px 20px; border-radius: 8px;
  font-size: 13px; z-index: 9999; transition: transform .3s; pointer-events: none;
  box-shadow: 0 4px 16px rgba(0,0,0,.2);
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { background: var(--sage); }
.toast.error   { background: var(--rose); }

/* ── SCROLLBAR ── */
.sidebar::-webkit-scrollbar { width: 0; }

/* ── MODO TABS (Individual / Casal) ── */
.modo-tabs{display:flex;gap:4px;margin-bottom:16px}
.modo-tab{padding:6px 16px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.6);font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:.15s}
.modo-tab.active{background:var(--gold);color:var(--deep);border-color:var(--gold);font-weight:600}
.modo-tab:hover:not(.active){background:rgba(255,255,255,.08);color:rgba(255,255,255,.85)}
/* ── CASAL LINKS ── */
.casal-links{display:flex;flex-direction:column;gap:12px}
.casal-partner{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:14px}
.casal-partner-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.4);margin-bottom:6px}
.casal-partner-link{font-family:'DM Mono',monospace;font-size:11px;color:var(--gold-lt);word-break:break-all;line-height:1.5;min-height:32px;background:rgba(0,0,0,.2);border-radius:6px;padding:8px 10px;margin-bottom:8px}
.casal-id-badge{display:inline-block;background:rgba(201,168,76,.2);color:var(--gold);border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700;font-family:'DM Mono',monospace;letter-spacing:1px}
/* ── CONCORDAR / DISCORDAR ── */
.concordar-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--border);margin-top:10px}
.concordar-label{font-size:11px;color:var(--text-lt);text-transform:uppercase;letter-spacing:.8px;flex:1;min-width:160px}
.concordar-btn{padding:5px 14px;border-radius:99px;border:1px solid;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;font-weight:600;transition:.15s}
.concordar-btn.concordo{color:var(--sage);border-color:var(--sage);background:rgba(90,122,110,.08)}
.concordar-btn.concordo.active{background:var(--sage);color:white}
.concordar-btn.discordo{color:var(--rose);border-color:var(--rose);background:rgba(184,92,110,.08)}
.concordar-btn.discordo.active{background:var(--rose);color:white}
/* ── CASAL COMPARISON ── */
.casal-compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.casal-profile{background:var(--cream);border:1px solid var(--border);border-radius:10px;padding:14px}
.casal-profile-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-lt);margin-bottom:6px}
.casal-profile-result{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:4px}
.casal-profile-sub{font-size:12px;color:var(--text-lt);line-height:1.5}
</style>
</head>
<body>
<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sb-header">
    <div class="sb-logo">
      <!-- Hermetic tree SVG -->
      <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="22" cy="22" r="20" stroke="rgba(201,168,76,.25)" stroke-width="1"/>
        <circle cx="22" cy="22" r="13" stroke="rgba(201,168,76,.15)" stroke-width="1"/>
        <line x1="22" y1="4" x2="22" y2="40" stroke="rgba(201,168,76,.3)" stroke-width="1"/>
        <line x1="4" y1="22" x2="40" y2="22" stroke="rgba(201,168,76,.3)" stroke-width="1"/>
        <circle cx="22" cy="10" r="2.5" fill="#c9a84c" opacity=".8"/>
        <circle cx="22" cy="34" r="2.5" fill="#c9a84c" opacity=".8"/>
        <circle cx="10" cy="22" r="2.5" fill="#c9a84c" opacity=".8"/>
        <circle cx="34" cy="22" r="2.5" fill="#c9a84c" opacity=".8"/>
        <circle cx="22" cy="22" r="3.5" fill="#c9a84c"/>
        <path d="M22 10 L30 17 L22 22 L14 17 Z" stroke="rgba(201,168,76,.4)" stroke-width=".8" fill="rgba(201,168,76,.05)"/>
        <path d="M22 34 L30 27 L22 22 L14 27 Z" stroke="rgba(201,168,76,.4)" stroke-width=".8" fill="rgba(201,168,76,.05)"/>
      </svg>
      <div class="sb-logo-text">
        <h1>Biblioteca Clínica<br>de Avaliações</h1>
        <p>Daniele Dallavecchia · HLE</p>
      </div>
    </div>
    <div class="sb-client-select">
      <label style="display:flex;justify-content:space-between;align-items:center">
        Cliente activa
        <button onclick="reloadClients()" title="Actualizar lista" style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.5);border-radius:4px;padding:2px 7px;font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif">↻</button>
      </label>
      <select id="selCliente" onchange="onClienteChange()">
        <option value="">— Seleccionar —</option>
      </select>
    </div>
    <button onclick="voltarFicha()" style="margin-top:12px;width:100%;display:flex;align-items:center;gap:8px;padding:9px 12px;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.25);border-radius:7px;color:var(--gold-lt);font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:.15s" onmouseover="this.style.background='rgba(201,168,76,.2)'" onmouseout="this.style.background='rgba(201,168,76,.1)'">
      <span style="font-size:14px">←</span> Voltar à Ficha Cliente
    </button>
  </div>

  <div class="sb-nav" id="sbNav">
    <!-- dynamically rendered -->
  </div>
</div>

<!-- MAIN -->
<div class="main" id="mainArea">

  <!-- WELCOME -->
  <div id="welcomeView">
    <div class="wv-icon">📚</div>
    <h2 class="wv-title">Biblioteca Clínica de Avaliações</h2>
    <p class="wv-sub">Selecciona uma avaliação no índice à esquerda para ver a sua ficha clínica completa — propósito, diagnósticos, guia de interpretação e envio ao cliente.</p>
    <div class="wv-stats" id="wvStats"></div>
  </div>

  <!-- QUIZ VIEW -->
  <div id="quizView">
    <div class="qv-hero" id="qvHero"></div>
    <div class="qv-body" id="qvBody"></div>
  </div>

</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════
// DADOS — QUIZZES (catálogo clínico completo)
// ══════════════════════════════════════════════════════════════
const QUIZZES = [
// ── VINCULAÇÃO ──────────────────────────────────────────────
{
  id: 'linguagem-amor',
  name: 'Linguagem de Amor',
  cat: 'Vinculação',
  icon: '💬', color: '#4a6fa5', bg: 'rgba(74,111,165,.12)',
  tempo: '15 min', disponivel: true,
  file: 'quiz_linguagem_amor.html',
  proposito: 'Identificar como a cliente expressa amor (dar) e como precisa de o receber — dimensões frequentemente divergentes. A discrepância DAR≠RECEBER é clinicamente relevante e aponta para padrões de auto-negação ou esquemas de auto-sacrifício.',

// CLIENTE — ler do localStorage da ficha
// ══════════════════════════════════════════════════════════════
function loadClients() {
  try {
    const raw = localStorage.getItem('dd_clients_v1');
    if (!raw) return {};
    return JSON.parse(raw);
  } catch(e) { return {}; }
}

let clients = loadClients();
let activeClientId = null;
let activeQuizId   = null;

function onClienteChange() {
  activeClientId = document.getElementById('selCliente').value || null;
  if (activeQuizId) renderQuizView(activeQuizId);
}

function populateClientSelect() {
  const sel = document.getElementById('selCliente');
  // Try reload from localStorage every time (in case ficha was opened after)
  clients = loadClients();
  const keys = Object.keys(clients).filter(k => clients[k]?.dados?.f_nome);
  
  if (keys.length === 0) {
    sel.innerHTML = '<option value="">⚠️ Sem clientes — abre a ficha no mesmo browser</option>';
    return;
  }
  sel.innerHTML = '<option value="">— Seleccionar cliente —</option>' +
    keys.map(k => {
      const nome = clients[k].dados.f_nome;
      const id   = clients[k].dados.f_id || '';
      return '<option value="' + k + '">' + nome + (id ? ' · ' + id : '') + '</option>';
    }).join('');
}

// Voltar à ficha terapeuta
function voltarFicha() {
  // v119: se estiver dentro de iframe (Biblioteca da ficha terapeuta), pedir ao parent para fechar
  try {
    if (window.parent && window.parent !== window) {
      try { window.parent.fecharBibliotecaOverlay(); return; } catch(_){}
      try { window.parent.postMessage('voltar-ficha-cliente', '*'); return; } catch(_){}
    }
  } catch(_){}
  if (document.referrer && document.referrer.includes(window.location.hostname)) {
    window.history.back();
    return;
  }
  const base = window.location.href.replace(/[^/\\]*$/, '');
  const fichaFile = localStorage.getItem('dd_ficha_filename') || 'ficha_terapeuta_v32.html';
  window.open(base + fichaFile, '_blank');
}

// Reload clients button click handler
function reloadClients() {
  populateClientSelect();
  const sel = document.getElementById('selCliente');
  const n = sel.options.length - 1;
  showToast(n > 0 ? '✓ ' + n + ' cliente(s) carregada(s)' : 'Sem clientes — abre a ficha primeiro', n > 0 ? 'success' : 'error');
}

// SIDEBAR — render nav
// ══════════════════════════════════════════════════════════════
function renderNav() {
  const nav = document.getElementById('sbNav');
  const cats = [...new Set(QUIZZES.map(q => q.cat))];
  nav.innerHTML = cats.map(cat => {
    const qs = QUIZZES.filter(q => q.cat === cat);
    return `<div class="sb-cat-label">${cat}</div>` +
      qs.map(q => `
        <button class="sb-item ${q.id === activeQuizId ? 'active' : ''}" onclick="selectQuiz('${q.id}')">
          <span class="ic">${q.icon}</span>
          <span class="nm">${q.name}</span>
          <span class="${q.disponivel ? 'badge-avail' : 'badge-wip'}">${q.disponivel ? '✓' : 'breve'}</span>
        </button>
      `).join('');
  }).join('');
}

function renderWelcomeStats() {
  const total  = QUIZZES.length;
  const avail  = QUIZZES.filter(q => q.disponivel).length;
  document.getElementById('wvStats').innerHTML = `
    <div class="wv-stat"><div class="wv-stat-n">${total}</div><div class="wv-stat-l">Avaliações</div></div>
    <div class="wv-stat"><div class="wv-stat-n">${avail}</div><div class="wv-stat-l">Disponíveis</div></div>
    <div class="wv-stat"><div class="wv-stat-n">${total - avail}</div><div class="wv-stat-l">Em desenvolvimento</div></div>
  `;
}

// ══════════════════════════════════════════════════════════════
// QUIZ VIEW — render
// ══════════════════════════════════════════════════════════════
function selectQuiz(id) {
  activeQuizId = id;
  renderNav();
  renderQuizView(id);
}

function renderQuizView(id) {
  const q = QUIZZES.find(x => x.id === id);
  if (!q) return;
  window.activeQuizObj = q; // needed for preview toggle buttons
  window._previewMode = window._previewMode || 'terapeuta'; // default terapeuta

  document.getElementById('welcomeView').style.display = 'none';
  const qv = document.getElementById('quizView');
  qv.style.display = 'flex';

  // Hero
  document.getElementById('qvHero').innerHTML = `
    <div class="qv-breadcrumb">
      <span>${q.cat}</span> › <strong>${q.name}</strong>
    </div>
    <div class="qv-title-row">
      <div class="qv-icon-badge" style="background:${q.bg}">${q.icon}</div>
      <div class="qv-title">
        <h1>${q.name}</h1>
        <div class="qv-meta">
          <span class="qv-tag">⏱ ${q.tempo}</span>
          <span class="qv-tag ${q.disponivel ? 'avail' : 'wip'}">${q.disponivel ? '✓ Disponível' : '🔧 Em desenvolvimento'}</span>
          <span class="qv-tag">${q.cat}</span>
        </div>
      </div>
    </div>`;

  // Body sections
  document.getElementById('qvBody').innerHTML =
    renderSection('proposito', '📌', 'Propósito Clínico', 'Quando e porquê usar esta avaliação',
      `<p class="prose">${q.proposito}</p>`) +

    renderSection('dimensoes', '🔍', 'O Que Revela', 'Dimensões avaliadas',
      `<ul style="padding-left:18px;display:flex;flex-direction:column;gap:6px">${
        q.dimensoes.map(d => `<li class="prose">${d}</li>`).join('')
      }</ul>`) +

    renderSection('hipoteses', '🏥', 'Hipóteses Diagnósticas', 'Leitura clínica por resultado',
      renderHipoteses(q.hipoteses)) +

    renderSection('decisoes', '🧭', 'Guia de Decisão Clínica', 'O que fazer com cada resultado',
      renderDecisoes(q.decisoes)) +

    renderSection('preview', '👁', 'Quiz Completo — Visão Terapeuta', 'Lê todas as perguntas e opções antes de enviar',
      renderPreviewQuiz(q)) +

    renderSection('perguntas', '💬', 'Perguntas para a Sessão', 'Questões a explorar após o quiz',
      `<div style="display:flex;flex-direction:column;gap:8px">${
        q.perguntas_sessao.map(p => `
          <div style="background:var(--cream);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:10px 14px;font-size:13px;color:var(--text);font-style:italic;line-height:1.6">
            "${p}"
          </div>`).join('')
      }</div>`) +

    renderSendSection(q) +
    renderIASection(q);

  // Open key sections by default
  toggleSection('proposito');
  toggleSection('preview');
  toggleSection('hipoteses');

  // Scroll top
  document.getElementById('mainArea').scrollTop = 0;
}

function renderSection(id, icon, title, subtitle, body) {
  return `
    <div class="section" id="sec-${id}">
      <div class="section-head" onclick="toggleSection('${id}')">
        <span class="section-head-icon">${icon}</span>
        <div class="section-head-text">
          <h3>${title}</h3>
          <p>${subtitle}</p>
        </div>
        <span class="section-toggle" id="stog-${id}">▾</span>
      </div>
      <div class="section-body hidden" id="sbody-${id}">${body}</div>
    </div>`;
}

function toggleSection(id) {
  const body = document.getElementById('sbody-' + id);
  const tog  = document.getElementById('stog-' + id);
  if (!body) return;
  const hidden = body.classList.toggle('hidden');
  if (tog) tog.classList.toggle('open', !hidden);
}

function renderHipoteses(hipoteses) {
  return `<div class="result-grid">${hipoteses.map((h, i) => `
    <div class="result-card" style="border-color:${h.cor}33">
      <div class="result-card-head" style="background:${h.bg}" onclick="this.nextElementSibling.classList.toggle('open')">
        <div style="width:10px;height:10px;border-radius:50%;background:${h.cor};flex-shrink:0"></div>
        <span class="result-card-label" style="color:${h.cor}">${h.label}</span>
        <span style="font-size:12px;color:${h.cor};opacity:.6">▾</span>
      </div>
      <div class="result-card-body">
        <p>${h.texto}</p>
        <div class="tag-row">${h.tags.map(t => `<span class="tag" style="background:${h.bg};color:${h.cor};border:1px solid ${h.cor}33">${t}</span>`).join('')}</div>
      </div>
    </div>`).join('')}</div>`;
}

function gerarLink(quizId, file) {
  if (!activeClientId || !clients[activeClientId]) { showToast('Selecciona um cliente primeiro', 'error'); return; }

  const c = clients[activeClientId];
  const nome = c.dados?.f_nome || '';
  const id   = c.dados?.f_id || activeClientId;
  const params = new URLSearchParams({ nome, id });
  
  // URL individual por quiz
  const quizUrl = QUIZ_URLS[quizId];
  const url = quizUrl + '?' + params.toString();

  if (!url) { showToast('URL não configurado para este quiz', 'error'); return; }

  const el = document.getElementById('sendLink_' + quizId);
  if (el) el.textContent = url;
  showToast('✓ Link gerado!', 'success');
}

function copiarLink(quizId) {
  const el = document.getElementById('sendLink_' + quizId);
  const url = el?.textContent?.trim();
  if (!url || url.startsWith('—')) { showToast('Gera o link primeiro', 'error'); return; }
  navigator.clipboard?.writeText(url).then(() => showToast('✓ Link copiado!', 'success'))
    .catch(() => { document.execCommand && (el.select?.(), document.execCommand('copy'), showToast('✓ Copiado!', 'success')); });
}

function enviarWhatsApp(quizId, quizName) {
  const el = document.getElementById('sendLink_' + quizId);
  const url = el?.textContent?.trim();
  if (!url || url.startsWith('—')) { gerarLink(quizId, QUIZZES.find(q=>q.id===quizId)?.file||''); return; }
  const nome = activeClientId && clients[activeClientId]?.dados?.f_nome?.split(' ')[0] || '';
  const msg = encodeURIComponent(`Olá ${nome}!\n\nDeixo aqui o link para o quiz que combinámos. São apenas alguns minutos e ajuda-nos muito no nosso trabalho juntas 🌿\n\n${url}`);
  window.open('https://wa.me/?text=' + msg, '_blank');
}

function enviarEmail(quizId, quizName) {
  const linkEl = document.getElementById('sendLink_' + quizId);
  let url = linkEl?.textContent?.trim();
  if (!url || url.startsWith('—')) { gerarLink(quizId, QUIZZES.find(q=>q.id===quizId)?.file||''); url = linkEl?.textContent?.trim() || ''; }

Responde em português europeu. Sê concreta, clínica, e orientada para a prática terapêutica.`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await resp.json();
    const interpretacao = data?.content?.[0]?.text || 'Erro ao gerar interpretação.';

    // Save to client record
    r.ia_interpretacao = interpretacao;
    localStorage.setItem('dd_clients_v1', JSON.stringify(clients));

    // Update UI
    const interp = document.getElementById('iainterp-' + rid);
    if (interp) {
      interp.innerHTML = `
        <div class="ia-interpretation-text">${interpretacao}</div>
        <div class="concordar-bar">
          <span class="concordar-label">A tua posição sobre esta análise:</span>
          <button class="concordar-btn concordo" onclick="saveConcordancia('${rid}','concordo')">✓ Concordo</button>
          <button class="concordar-btn discordo" onclick="saveConcordancia('${rid}','discordo')">✗ Discordo</button>
        </div>
        <div class="ia-notas-label">💬 A minha leitura — notas e comentários</div>
        <textarea class="ia-notas-area" id="ianotas-${rid}"
          placeholder="Escreve aqui a tua leitura, dúvidas ou conversa com a IA..."
          oninput="saveIaNotas('${rid}', this.value)">${r.ia_notas||''}</textarea>`;
    }
    if (btn) { btn.textContent = '↺ Regenerar'; btn.disabled = false; }
    showToast('✓ Interpretação clínica gerada!', 'success');

  } catch(err) {
    console.error('[IA]', err);
    if (btn) { btn.textContent = '🧠 Interpretar com IA'; btn.disabled = false; }
    showToast('Erro ao contactar a IA. Tenta novamente.', 'error');
  }
}

function saveIaNotas(rid, val) {
  if (!activeClientId || !clients[activeClientId]) return;
  const arr = clients[activeClientId].quiz_resultados || [];
  const r = arr.find(x => (x.id === rid) || (x.timestamp === rid));
  if (r) {
    r.ia_notas = val;
    localStorage.setItem('dd_clients_v1', JSON.stringify(clients));
  }
}

// ══════════════════════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════════════════════
let _toastTimer;

// ── FUNÇÕES MODO CASAL ───────────────────────────────────────────────────
function gerarLinkCasal(quizId) {
  if (!activeClientId || !clients[activeClientId]) { showToast('Selecciona um cliente primeiro', 'error'); return; }
  const c = clients[activeClientId];
  const idCliente = c.dados?.f_id || activeClientId;
  const casalId = Math.random().toString(36).substr(2, 6).toUpperCase();
  const nomeA = document.getElementById('casalNomeA_' + quizId)?.value?.trim() || 'Parceiro A';
  const nomeB = document.getElementById('casalNomeB_' + quizId)?.value?.trim() || 'Parceiro B';
  const q = QUIZZES.find(x => x.id === quizId);
  const baseUrl = localStorage.getItem('dd_quiz_base_url') || 'https://danieledallavecchia-netizen.github.io/Quizzes';
  const fileUrl = baseUrl + '/' + (q?.file_casal || q?.file || '');
  const linkA = fileUrl + '?nome=' + encodeURIComponent(nomeA) + '&id=' + encodeURIComponent(idCliente) + '&casal_id=' + casalId + '&parceiro=1';
  const linkB = fileUrl + '?nome=' + encodeURIComponent(nomeB) + '&id=' + encodeURIComponent(idCliente) + '&casal_id=' + casalId + '&parceiro=2';
  const elA = document.getElementById('casalLinkA_' + quizId);
  const elB = document.getElementById('casalLinkB_' + quizId);
  const elId = document.getElementById('casalId_' + quizId);
  if (elA) elA.textContent = linkA;
  if (elB) elB.textContent = linkB;
  if (elId) elId.textContent = casalId;
  showToast('\u2713 Links do casal gerados! ID: ' + casalId, 'success');
}
function copiarLinkCasal(quizId, parceiro) {
  const el = document.getElementById('casalLink' + parceiro + '_' + quizId);
  if (!el || el.textContent.startsWith('\u2014')) { showToast('Gera os links primeiro', 'warning'); return; }
  navigator.clipboard.writeText(el.textContent).then(() => showToast('\u2713 Link do Parceiro ' + parceiro + ' copiado!', 'success'));
}
function enviarWhatsAppCasal(quizId, parceiro, quizName) {
  const el = document.getElementById('casalLink' + parceiro + '_' + quizId);
  if (!el || el.textContent.startsWith('\u2014')) { showToast('Gera os links primeiro', 'warning'); return; }
  const msg = encodeURIComponent('Ol\u00e1! Segue o link para o teu question\u00e1rio de ' + quizName + ':\n' + el.textContent);
  window.open('https://wa.me/?text=' + msg, '_blank');
}
// ── CONCORDAR / DISCORDAR ─────────────────────────────────────────────────
function saveConcordancia(rid, valor) {
  if (!activeClientId || !clients[activeClientId]) return;
  const arr = clients[activeClientId].quiz_resultados || [];
  const r = arr.find(x => x.id === rid || x.timestamp === rid);
  if (r) {
    r.ia_concordancia = r.ia_concordancia === valor ? null : valor;
    localStorage.setItem('dd_clients_v1', JSON.stringify(clients));
    renderQuizView(activeQuizId);
  }
}
// ── IA CASAL ─────────────────────────────────────────────────────────────
function interpretarIACasal(quizId) {
  if (!activeClientId || !clients[activeClientId]) return;
  const c = clients[activeClientId];
  const arr = (c.quiz_resultados || []).filter(x => x.quiz === quizId);
  const r1 = arr.find(x => x.parceiro === '1') || arr[0];
  const r2 = arr.find(x => x.parceiro === '2') || arr[1];
  if (!r1 || !r2) { showToast('Precisas de 2 resultados do casal para comparar', 'warning'); return; }
  const q = QUIZZES.find(x => x.id === quizId);
  const nomeA = r1.nome || 'Parceiro A';
  const nomeB = r2.nome || 'Parceiro B';
  const promptCasal = 'Es uma terapeuta psicanalit\u00edca especializada em terapia de casal. Analisa os dois perfis de ' + (q?.name||quizId) + ' e fornece uma interpret\u00e7\u00e3o cl\u00ednica comparativa em portugu\u00eas europeu.\n\nPERFIL A \u2014 ' + nomeA + ': ' + JSON.stringify(r1.resumo || r1.dados || r1) + '\nPERFIL B \u2014 ' + nomeB + ': ' + JSON.stringify(r2.resumo || r2.dados || r2) + '\n\nInclui: 1) Din\u00e2mica relacional 2) Pontos de complementaridade 3) Zonas de tens\u00e3o 4) Sugest\u00f5es terap\u00eauticas espec\u00edficas para este casal.';

  const iaBox = document.getElementById('ia-casal-result-' + quizId);
  if (iaBox) {
    iaBox.style.display = 'block';
    iaBox.innerHTML = '<div class="ia-loading"><div class="ia-spinner"></div><span>A analisar compatibilidade do casal...</span></div>';
  }
  const antKey = localStorage.getItem('dd_ant_key') || '';
  fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': antKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({
      model: 'claude-opus-4-5', max_tokens: 1200,
      system: 'Es uma terapeuta psicanalit\u00edca. Escreve notas cl\u00ednicas confidenciais em portugu\u00eas europeu. Usa markdown b\u00e1sico.',
      messages: [{ role: 'user', content: promptCasal }]
    })
  })
  .then(function(resp) { return resp.json(); })
  .then(function(data) {
    const text = (data.content && data.content[0] && data.content[0].text) || 'Erro na interpreta\u00e7\u00e3o.';
    const rid = 'casal_' + quizId + '_' + Date.now();
    if (iaBox) {
      iaBox.innerHTML = '<div class="ia-interpretation">' +
        '<div class="ia-interpretation-header"><span class="ia-model-badge">\ud83d\udc91 An\u00e1lise de Casal \u2014 ' + nomeA + ' & ' + nomeB + '</span></div>' +
        '<div class="ia-text" style="white-space:pre-wrap;line-height:1.7">' + text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>') + '</div>' +
        '<div class="concordar-bar"><span class="concordar-label">A tua posi\u00e7\u00e3o sobre esta an\u00e1lise:</span>' +
        '<button class="concordar-btn concordo" onclick="saveCasalConcordancia(\'' + rid + '\',\'concordo\',\'' + quizId + '\')">\u2713 Concordo</button>' +
        '<button class="concordar-btn discordo" onclick="saveCasalConcordancia(\'' + rid + '\',\'discordo\',\'' + quizId + '\')">\u2717 Discordo</button>' +
        '</div>' +
        '<div style="margin-top:12px"><label style="font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-lt)">A minha leitura \u2014 notas e coment\u00e1rios</label>' +
        '<textarea id="notas-casal-' + rid + '" rows="4" placeholder="Observa\u00e7\u00f5es cl\u00ednicas, concord\u00e2ncias, diverg\u00eancias..." style="width:100%;margin-top:6px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-family:\'DM Sans\',sans-serif;font-size:13px;resize:vertical;background:white"></textarea>' +
        '<button class="btn btn-primary" style="margin-top:8px" onclick="saveCasalNotas(\'' + rid + '\',\'' + quizId + '\')">\ud83d\udcbe Guardar Notas</button>' +
        '</div></div>';
    }
  })
  .catch(function(err) { if (iaBox) iaBox.innerHTML = '<div style="color:red;padding:10px">Erro: ' + err.message + '</div>'; });
}
function saveCasalConcordancia(rid, valor, quizId) {
  if (!activeClientId || !clients[activeClientId]) return;
  if (!clients[activeClientId].ia_casal) clients[activeClientId].ia_casal = {};
  clients[activeClientId].ia_casal[rid] = { concordancia: valor };
  localStorage.setItem('dd_clients_v1', JSON.stringify(clients));
  const cBtn = document.getElementById('conc-concordo-' + rid);
  const dBtn = document.getElementById('conc-discordo-' + rid);
  document.querySelectorAll('.concordar-btn').forEach(b => b.classList.remove('active'));
  showToast('Posi\u00e7\u00e3o guardada', 'success');
}
function saveCasalNotas(rid, quizId) {
  const ta = document.getElementById('notas-casal-' + rid);
  if (!ta || !activeClientId || !clients[activeClientId]) return;
  if (!clients[activeClientId].ia_casal) clients[activeClientId].ia_casal = {};
  if (!clients[activeClientId].ia_casal[rid]) clients[activeClientId].ia_casal[rid] = {};
  clients[activeClientId].ia_casal[rid].notas = ta.value;
  localStorage.setItem('dd_clients_v1', JSON.stringify(clients));
  showToast('\u2713 Notas guardadas', 'success');
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

  populateClientSelect();
  window.addEventListener('storage', e => { if (e.key === 'dd_clients_v1') populateClientSelect(); });
  renderNav();

  // Auto-seleccionar quiz se vier da ficha com ?quiz=...
