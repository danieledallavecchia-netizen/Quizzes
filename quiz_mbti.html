<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Questionário de Personalidade MBTI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,sans-serif;background:linear-gradient(135deg,#f8f5ff 0%,#f0f4ff 100%);min-height:100vh;color:#2d2d3a}
.cover{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.cover-icon{width:80px;height:80px;background:linear-gradient(135deg,#7b5ea7,#4a6fa5);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 24px;box-shadow:0 8px 24px rgba(123,94,167,.25)}
.cover-title{font-size:clamp(22px,5vw,30px);font-weight:700;color:#2d2d3a;margin-bottom:8px}
.cover-sub{font-size:15px;color:#6b6b80;max-width:420px;line-height:1.7;margin-bottom:10px}
.cover-time{font-size:13px;color:#9b8ec0;margin-bottom:32px}
.cover-start{padding:14px 40px;background:linear-gradient(135deg,#7b5ea7,#4a6fa5);color:white;border:none;border-radius:50px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(123,94,167,.3);transition:.2s}
.cover-start:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(123,94,167,.4)}
.quiz-wrap{max-width:640px;margin:0 auto;padding:24px 20px}
.progress-bar{background:#e8e0f5;border-radius:99px;height:6px;margin-bottom:8px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#7b5ea7,#4a6fa5);border-radius:99px;transition:.4s}
.q-counter{font-size:12px;color:#9b8ec0;text-align:right;margin-bottom:20px;letter-spacing:.5px}
.dim-badge{display:inline-block;padding:3px 12px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:14px;background:rgba(123,94,167,.1);color:#7b5ea7}
.q-text{font-size:clamp(16px,4vw,19px);font-weight:600;color:#2d2d3a;line-height:1.5;margin-bottom:24px}
.option-btn{width:100%;text-align:left;padding:15px 18px;margin-bottom:10px;background:white;border:2px solid #e8e0f5;border-radius:12px;font-size:14px;font-family:inherit;cursor:pointer;transition:.15s;color:#2d2d3a;line-height:1.4;display:flex;gap:12px;align-items:flex-start}
.opt-letter{width:28px;height:28px;border-radius:50%;background:#f0eaf8;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#7b5ea7;flex-shrink:0;margin-top:1px}
.option-btn:hover{border-color:#7b5ea7;background:#faf8ff}
.option-btn.selected{border-color:#7b5ea7;background:linear-gradient(135deg,rgba(123,94,167,.1),rgba(74,111,165,.06));font-weight:500}
.option-btn.selected .opt-letter{background:linear-gradient(135deg,#7b5ea7,#4a6fa5);color:white}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:24px}
.btn-nav{padding:11px 28px;border-radius:99px;border:none;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn-back{background:#f0eaf8;color:#7b5ea7}
.btn-next{background:linear-gradient(135deg,#7b5ea7,#4a6fa5);color:white;box-shadow:0 4px 12px rgba(123,94,167,.25)}
.btn-next:disabled{opacity:.35;cursor:default;box-shadow:none}
.result-wrap{max-width:640px;margin:0 auto;padding:24px 20px 60px}
.result-header{background:linear-gradient(135deg,#7b5ea7,#4a6fa5);border-radius:20px;padding:28px;color:white;margin-bottom:16px;text-align:center}
.result-type{font-size:48px;font-weight:700;letter-spacing:4px;margin-bottom:4px}
.result-name{font-size:18px;font-weight:600;opacity:.95;margin-bottom:8px}
.result-tagline{font-size:14px;opacity:.8;line-height:1.5}
.result-card{background:white;border-radius:16px;padding:22px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.card-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#9b8ec0;margin-bottom:14px}
.dim-row{margin-bottom:14px}
.dim-labels{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:5px}
.dim-track{background:#f0eaf8;border-radius:99px;height:8px;overflow:hidden;position:relative}
.dim-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#7b5ea7,#4a6fa5);transition:.6s}
.dim-percent{font-size:11px;color:#9b8ec0;text-align:right;margin-top:2px}
.result-desc{font-size:14px;line-height:1.75;color:#4a4a5a}
.sending{text-align:center;padding:60px 20px}
.sending-icon{font-size:40px;margin-bottom:16px}
.sending p{color:#8b8ba0;font-size:14px}
.hidden{display:none}
.nome-tag{font-size:13px;color:white;opacity:.75;margin-bottom:4px}
</style>
</head>
<body>

<!-- COVER -->
<div id="cover" class="cover">
  <div class="cover-icon">🧠</div>
  <h1 class="cover-title">Perfil de Personalidade MBTI</h1>
  <p class="cover-sub">Descobre o teu tipo de personalidade através de 16 perguntas sobre as tuas preferências naturais em 4 dimensões.</p>
  <p class="cover-time">⏱ 5–8 minutos · 16 perguntas</p>
  <button class="cover-start" onclick="iniciar()">Começar →</button>
</div>

<!-- QUIZ -->
<div id="quiz" class="quiz-wrap hidden">
  <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
  <div class="q-counter" id="counter"></div>
  <div class="dim-badge" id="dimBadge"></div>
  <div class="q-text" id="qtext"></div>
  <div id="options"></div>
  <div class="nav-row">
    <button class="btn-nav btn-back" onclick="anterior()">← Anterior</button>
    <button class="btn-nav btn-next" id="btnNext" onclick="proximo()" disabled>Seguinte →</button>
  </div>
</div>

<!-- SENDING -->
<div id="sending" class="sending hidden">
  <div class="sending-icon">📤</div>
  <p>A guardar o teu resultado…</p>
</div>

<!-- RESULT -->
<div id="result" class="result-wrap hidden"></div>

<script>
const APPS_URL = 'https://script.google.com/macros/s/AKfycbxW4NiXlsKJMLB3sNGaus2gllggJgY-LnPcbQnOD2T6Cq5DxDAYk-W0lm1nLdvNxifC/exec';

const params = new URLSearchParams(window.location.search);
const NOME = params.get('nome') || '';
const CLIENT_ID = params.get('id') || '';

const PERGUNTAS = [
  // E/I
  {dim:'E/I',texto:'Após um fim de semana longo, o que te dá mais energia?',opcoes:[{polo:'E',texto:'Estar com pessoas — encontros, convívio, movimento'},{polo:'I',texto:'Tempo sozinha — silêncio, recarregar sem estímulos'}]},
  {dim:'E/I',texto:'Num grupo novo, como te comportas habitualmente?',opcoes:[{polo:'E',texto:'Tomo iniciativa de conversar, apresento-me facilmente'},{polo:'I',texto:'Prefiro observar primeiro, falo quando me sinto confortável'}]},
  {dim:'E/I',texto:'Quando precisas de resolver um problema difícil, preferes…',opcoes:[{polo:'E',texto:'Falar com alguém — pensar em voz alta ajuda-me muito'},{polo:'I',texto:'Reflectir sozinha antes de partilhar as minhas conclusões'}]},
  {dim:'E/I',texto:'Como te sentes depois de uma festa longa com muita gente?',opcoes:[{polo:'E',texto:'Energizada e bem — adoro essa energia colectiva'},{polo:'I',texto:'Esgotada — preciso de tempo a sós para recuperar'}]},
  // S/N
  {dim:'S/N',texto:'Quando aprendes algo novo, preferes…',opcoes:[{polo:'S',texto:'Informação concreta, factos, exemplos práticos do dia-a-dia'},{polo:'N',texto:'Teorias, padrões, ligações entre ideias e conceitos'}]},
  {dim:'S/N',texto:'O que mais te motiva num projecto?',opcoes:[{polo:'S',texto:'Resultados concretos, passos claros, progresso visível'},{polo:'N',texto:'A visão maior, as possibilidades, o que ainda não existe'}]},
  {dim:'S/N',texto:'Quando describes uma experiência, tendes a…',opcoes:[{polo:'S',texto:'Dar detalhes precisos — o que aconteceu, como foi, em ordem'},{polo:'N',texto:'Saltar para o significado — o que aquilo revelou ou simbolizou'}]},
  {dim:'S/N',texto:'O que preferes no teu trabalho ou rotina?',opcoes:[{polo:'S',texto:'Clareza, consistência, métodos testados que funcionam'},{polo:'N',texto:'Variedade, desafio, liberdade para experimentar formas novas'}]},
  // T/F
  {dim:'T/F',texto:'Quando alguém te pede conselho, o que fazes primeiro?',opcoes:[{polo:'T',texto:'Analiso a situação de forma objectiva e apresento soluções'},{polo:'F',texto:'Ouço com empatia e pergunto como a pessoa se sente'}]},
  {dim:'T/F',texto:'Numa decisão difícil, o que pesa mais para ti?',opcoes:[{polo:'T',texto:'A lógica e os factos — o que faz mais sentido objectivamente'},{polo:'F',texto:'O impacto nas pessoas e nos valores que me importam'}]},
  {dim:'T/F',texto:'Quando há conflito, a tua tendência é…',opcoes:[{polo:'T',texto:'Ir directo ao problema e resolvê-lo de forma racional'},{polo:'F',texto:'Cuidar primeiro das emoções e da relação envolvida'}]},
  {dim:'T/F',texto:'O que te incomoda mais numa decisão?',opcoes:[{polo:'T',texto:'Que não seja justa ou coerente com os princípios'},{polo:'F',texto:'Que magoe alguém ou quebre uma relação importante'}]},
  // J/P
  {dim:'J/P',texto:'Como te sentes em relação a planos e prazos?',opcoes:[{polo:'J',texto:'Gosto de ter tudo organizado — planos dão-me segurança'},{polo:'P',texto:'Prefiro flexibilidade — adaptar-me conforme o momento'}]},
  {dim:'J/P',texto:'O teu espaço de trabalho ou casa é habitualmente…',opcoes:[{polo:'J',texto:'Organizado — um lugar para cada coisa, rotina estável'},{polo:'P',texto:'Criativo e variável — organização surge quando é necessário'}]},
  {dim:'J/P',texto:'Quando tens uma decisão a tomar, preferes…',opcoes:[{polo:'J',texto:'Decidir rapidamente e seguir em frente com o plano'},{polo:'P',texto:'Manter opções abertas até ter mais informação'}]},
  {dim:'J/P',texto:'Como te sentes quando os planos mudam de última hora?',opcoes:[{polo:'J',texto:'Fico desconfortável — prefiro saber com antecedência'},{polo:'P',texto:'Adapto-me bem — às vezes até prefiro a espontaneidade'}]},
];

const TIPOS = {
  INTJ:{nome:'A Arquitecta',desc:'Mente estratégica e independente. Vê padrões complexos, planeia a longo prazo, valoriza competência e autonomia. Raramente se abre emocionalmente, mas é profundamente fiel às suas convicções.'},
  INTP:{nome:'A Lógica',desc:'Intelectualmente curiosa, analítica e criativa. Adora explorar teorias e ideias abstractas. Pode parecer distante, mas tem um mundo interior riquíssimo.'},
  ENTJ:{nome:'A Comandante',desc:'Líder natural, decisiva e eficiente. Vê oportunidades e age com determinação. Pode ser directa ao ponto de parecer fria, mas age sempre com propósito.'},
  ENTP:{nome:'A Debatedora',desc:'Criativa, rápida e cheia de ideias. Adora desafiar o status quo e explorar possibilidades. Pode ter dificuldade em concluir projectos — começa mais do que termina.'},
  INFJ:{nome:'A Advogada',desc:'Visionária e empática. Tem convicções profundas sobre o que deve ser o mundo e trabalha discretamente para o realizar. Raramente partilha o seu mundo interior.'},
  INFP:{nome:'A Mediadora',desc:'Idealista, criativa e profundamente fiel aos seus valores. Sente tudo com intensidade. Procura autenticidade nas relações e significado em tudo o que faz.'},
  ENFJ:{nome:'A Protagonista',desc:'Carismática e orientada para as pessoas. Tem o dom de inspirar e liderar com calor. Coloca frequentemente os outros à frente das suas próprias necessidades.'},
  ENFP:{nome:'A Activista',desc:'Entusiasta, criativa e cheia de energia social. Vê potencial em tudo e em todos. Pode ter dificuldade com rotinas e com terminar o que começa.'},
  ISTJ:{nome:'A Logística',desc:'Responsável, metódica e de confiança absoluta. Cumpre o que promete. Prefere factos a teorias e valoriza tradição, consistência e dever.'},
  ISFJ:{nome:'A Defensora',desc:'Cuidadora dedicada e discreta. Lembra-se de todos os detalhes das pessoas que ama. Trabalha em silêncio, sem pedir reconhecimento.'},
  ESTJ:{nome:'A Executiva',desc:'Organizada, directa e decisiva. Gosta de estrutura e de resultados claros. Lidera com eficiência mas pode ser inflexível quando acredita ter razão.'},
  ESFJ:{nome:'A Cônsul',desc:'Calorosa, dedicada e orientada para a harmonia. Cuida activamente das pessoas à sua volta. Precisa de sentir que os seus esforços são valorizados.'},
  ISTP:{nome:'A Virtuosa',desc:'Prática, analítica e independente. Resolve problemas com maestria. Prefere acção a palavras e tem dificuldade com compromissos emocionais.'},
  ISFP:{nome:'A Aventureira',desc:'Sensível, criativa e vive o momento. Tem um sentido estético apurado. Evita conflitos e prefere mostrar afecto através de actos do que palavras.'},
  ESTP:{nome:'A Empreendedora',desc:'Energética, directa e orientada para a acção. Resolve crises com calma e criatividade. Pode ser impulsiva e evitar comprometimentos a longo prazo.'},
  ESFP:{nome:'A Animadora',desc:'Espontânea, calorosa e cheia de vida. Adora estar com pessoas e criar momentos memoráveis. Pode ter dificuldade com planeamento e disciplina.'},
};

const DIM_LABELS = {
  'E/I': ['Extroversão (E)', 'Introversão (I)'],
  'S/N': ['Sensorial (S)', 'Intuição (N)'],
  'T/F': ['Pensamento (T)', 'Sentimento (F)'],
  'J/P': ['Julgamento (J)', 'Percepção (P)'],
};

let atual = 0;
let respostas = {}; // dim -> polo

function iniciar() {
  document.getElementById('cover').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  // Se nome via URL, skip cover já feito
  mostrarPergunta();
}

function mostrarPergunta() {
  const p = PERGUNTAS[atual];
  const total = PERGUNTAS.length;
  document.getElementById('prog').style.width = ((atual/total)*100)+'%';
  document.getElementById('counter').textContent = `Pergunta ${atual+1} de ${total}`;
  document.getElementById('dimBadge').textContent = 'Dimensão ' + p.dim;
  document.getElementById('qtext').textContent = p.texto;
  const sel = respostas[atual];
  document.getElementById('btnNext').disabled = sel === undefined;
  const letters = ['A','B'];
  document.getElementById('options').innerHTML = p.opcoes.map((o,i) => `
    <button class="option-btn ${sel===i?'selected':''}" onclick="selecionar(${i})">
      <div class="opt-letter">${letters[i]}</div>
      <span>${o.texto}</span>
    </button>`).join('');
}

function selecionar(i) {
  respostas[atual] = i;
  mostrarPergunta();
  document.getElementById('btnNext').disabled = false;
}

function anterior() {
  if (atual > 0) { atual--; mostrarPergunta(); }
}

function proximo() {
  if (atual < PERGUNTAS.length - 1) {
    atual++;
    mostrarPergunta();
  } else {
    calcular();
  }
}

function calcular() {
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('sending').classList.remove('hidden');

  // Contar por dimensão
  const counts = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  PERGUNTAS.forEach((p,i) => {
    const sel = respostas[i];
    if (sel !== undefined) counts[p.opcoes[sel].polo]++;
  });

  const tipo = (counts.E>=counts.I?'E':'I') + (counts.S>=counts.N?'S':'N') + (counts.T>=counts.F?'T':'F') + (counts.J>=counts.P?'J':'P');
  const info = TIPOS[tipo] || {nome:'Tipo único',desc:'Personalidade com características especiais.'};

  const dims = [
    {dim:'E/I',a:counts.E,b:counts.I,labelA:'E',labelB:'I'},
    {dim:'S/N',a:counts.S,b:counts.N,labelA:'S',labelB:'N'},
    {dim:'T/F',a:counts.T,b:counts.F,labelA:'T',labelB:'F'},
    {dim:'J/P',a:counts.J,b:counts.P,labelA:'J',labelB:'P'},
  ];

  const resumo = `${tipo} — ${info.nome}`;
  const dados = {tipo, nome_tipo:info.nome, E:counts.E, I:counts.I, S:counts.S, N:counts.N, T:counts.T, F:counts.F, J:counts.J, P:counts.P};

  enviar({quiz:'mbti', resumo, dados, nome:NOME, id:CLIENT_ID}, () => mostrarResultado(tipo, info, dims));
}

function enviar(payload, cb) {
  const cbName = 'cb_' + Date.now();
  window[cbName] = () => { cb(); };
  const s = document.createElement('script');
  s.src = APPS_URL + '?callback=' + cbName + '&data=' + encodeURIComponent(JSON.stringify(payload));
  s.onerror = () => cb();
  document.head.appendChild(s);
  setTimeout(cb, 6000);
}

function mostrarResultado(tipo, info, dims) {
  document.getElementById('sending').classList.add('hidden');
  const el = document.getElementById('result');
  el.classList.remove('hidden');

  const dimHtml = dims.map(d => {
    const total = d.a + d.b;
    const pctA = total ? Math.round((d.a/total)*100) : 50;
    const lbls = DIM_LABELS[d.dim];
    return `<div class="dim-row">
      <div class="dim-labels"><span>${lbls[0]}</span><span>${lbls[1]}</span></div>
      <div class="dim-track"><div class="dim-fill" style="width:${pctA}%"></div></div>
      <div class="dim-percent">${d.labelA}: ${pctA}% · ${d.labelB}: ${100-pctA}%</div>
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="result-header">
      ${NOME ? `<div class="nome-tag">${NOME}</div>` : ''}
      <div class="result-type">${tipo}</div>
      <div class="result-name">${info.nome}</div>
    </div>
    <div class="result-card">
      <div class="card-title">As tuas 4 dimensões</div>
      ${dimHtml}
    </div>
    <div class="result-card">
      <div class="card-title">O teu perfil</div>
      <div class="result-desc">${info.desc}</div>
    </div>
    <div class="result-card" style="text-align:center;color:#9b8ec0;font-size:13px">
      ✓ Resultado enviado à tua terapeuta
    </div>`;
}

// Auto-iniciar se vier com nome no URL
if (NOME) iniciar();
</script>
</body>
</html>
